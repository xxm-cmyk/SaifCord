name: SaifCord Release

# Prevent parallel commits from uploading duplicate assets to the same version tag.
concurrency:
    group: saifcord-release-${{ github.ref }}
    cancel-in-progress: false

on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ github.token }}
    EQUICORD_REMOTE: xxm-cmyk/SaifCord

permissions:
    contents: write
    actions: write

jobs:
    Validate:
        name: Validate Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Lint & type-check
              run: pnpm test

    Build:
        name: Build SaifCord
        needs: Validate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Setup PNPM
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@v24
                  require-lockfile: true
            - name: Build web
              run: pnpm buildWebStandalone
            - name: Build
              run: pnpm buildStandalone
            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json
            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir -p release
                  cp browser/browser.* release 2>/dev/null || true
                  cp Equicord.user.{js,js.LEGAL.txt} release 2>/dev/null || true
                  cp *.{json,zip,asar} release 2>/dev/null || true
                  cp desktop/* release 2>/dev/null || true
                  for file in equibop/*; do
                    [ -e "$file" ] || continue
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done
                  find release -size 0 -delete
                  rm -f release/package.json release/*.map
            - name: Publish versioned SaifCord release
              if: ${{ github.repository == 'xxm-cmyk/SaifCord' && vars.ACT != 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="v$VERSION"
                  gh release create "$TAG" --target "$GITHUB_SHA" --title "SaifCord $VERSION" --notes "Official Release" 2>/dev/null || \
                  gh release edit "$TAG" --title "SaifCord $VERSION" --notes "Official Release"
                  # Replace assets with matching names instead of failing on re-runs.
                  gh release upload "$TAG" dist/release/* --clobber

    WindowsInstaller:
        name: Build Windows EXE Installer
        needs: Build
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build standalone payload
              run: pnpm buildStandalone
            - name: Prepare installer payload
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force installer/payload | Out-Null
                  Copy-Item (Get-Command node).Source installer/payload/node.exe
                  Copy-Item installer/install.mjs installer/payload/install.mjs
                  Copy-Item scripts/saudicord/asar.mjs installer/payload/asar.mjs
                  Copy-Item dist/desktop.asar installer/payload/saifcord.asar
            - name: Setup .NET 8
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x
            - name: Publish native WPF installer
              shell: pwsh
              run: |
                  dotnet publish installer/WindowsApp/SaudiCord.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o installer/output
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  Rename-Item installer/output/SaifCord.Setup.exe SaifCord-Setup.exe
            - name: Upload SaifCord Setup
              if: ${{ github.repository == 'xxm-cmyk/SaifCord' && vars.ACT != 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: pwsh
              run: |
                  $version = node -p "require('./package.json').version"
                  $tag = "v$version"
                  gh release create $tag --target $env:GITHUB_SHA --title "SaifCord $version" --notes "Official Release" 2>$null
                  if ($LASTEXITCODE -ne 0) {
                    gh release edit $tag --title "SaifCord $version" --notes "Official Release"
                  }
                  gh release upload $tag --clobber installer/output/SaifCord-Setup.exe
